<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>InfiniTech CPCU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c10;--bg2:#14141a;--bg3:#1c1c24;--fg:#e0dfd8;--fg2:#888680;
--a:#4a90d9;--g:#48c774;--r:#e24b4a;--am:#ef9f27;--p:#7f77dd;--t:#1d9e75}
body{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
.root{display:flex;flex-direction:column;height:100vh}
.hdr{height:42px;background:var(--bg2);border-bottom:1px solid #222;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.hdr h1{font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--a)}
.pill{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:500}
.ok{background:#48c77422;color:var(--g)}.err{background:#e24b4a22;color:var(--r)}.wrn{background:#ef9f2722;color:var(--am)}
.tabs{display:flex;gap:0;margin-left:16px}
.tab{padding:6px 16px;font-size:10px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg2);transition:.15s}
.tab:hover{color:var(--fg)}.tab.on{color:var(--a);border-bottom-color:var(--a)}
.body{flex:1;overflow:hidden;position:relative}
.page{display:none;width:100%;height:100%}.page.on{display:flex}

/* Page 1: Arm */
.p1{display:none}.p1.on{display:grid;grid-template-columns:1fr 340px}
.cv{position:relative;overflow:hidden}
#c{display:block;width:100%;height:100%}
.ov{position:absolute;top:12px;left:12px;pointer-events:none}
.gn{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.gc{font-size:11px;color:var(--fg2);margin-top:2px}
.cbar{width:160px;height:5px;background:var(--bg3);border-radius:3px;margin-top:4px;overflow:hidden}
.cfill{height:100%;border-radius:3px;transition:width .12s,background .2s}
.sb{background:var(--bg2);border-left:1px solid #222;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.pn{background:var(--bg3);border-radius:6px;padding:10px}
.pt{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--fg2);margin-bottom:6px}
.sr{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10px}
.sn{width:58px;color:var(--fg2)}.sw{flex:1;height:5px;background:var(--bg);border-radius:3px}
.sf{height:100%;border-radius:3px;background:var(--a);transition:width .12s;min-width:2px}
.sv{width:40px;text-align:right;font-variant-numeric:tabular-nums}
.cr{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:10px}
.cn{width:50px;color:var(--fg2)}.cw{flex:1;height:10px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.cfl{height:100%;border-radius:3px;transition:width .15s}.cv2{width:32px;text-align:right;font-variant-numeric:tabular-nums;font-size:9px}
.hyst-row{display:flex;align-items:center;gap:6px;font-size:10px;margin-top:4px}
.hyst-bar{width:100px;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.hyst-fill{height:100%;border-radius:4px;background:var(--am);transition:width .12s}
.hyst-label{color:var(--fg2);font-size:9px}

/* Page 2: EMG */
.p2{display:none;flex-direction:column;padding:20px;gap:16px;overflow-y:auto}.p2.on{display:flex}
.emg-card{background:var(--bg3);border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px}
.emg-idx{font-size:20px;font-weight:700;color:var(--p);width:36px;text-align:center}
.emg-info{flex:1}
.emg-name{font-size:12px;margin-bottom:4px}
.emg-bw{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.emg-bf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--a));transition:width .12s}
.emg-val{font-size:11px;color:var(--fg2);margin-top:2px;font-variant-numeric:tabular-nums}

/* Page 3: Diagnostics */
.p3{display:none;flex-direction:column;padding:20px;gap:16px;overflow-y:auto}.p3.on{display:flex}
.dg-section{background:var(--bg3);border-radius:8px;padding:14px}
.dg-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--a);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #222}
.dg-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px solid #1a1a20}
.dg-row:last-child{border:none}
.dg-row .l{color:var(--fg2)}.dg-row .v{font-variant-numeric:tabular-nums}
.dg-row .v.good{color:var(--g)}.dg-row .v.bad{color:var(--r)}.dg-row .v.warn{color:var(--am)}
</style>
</head>
<body>
<div class="root">
<div class="hdr">
  <h1>InfiniTech</h1>
  <span class="pill err" id="ws">disconnected</span>
  <span class="pill wrn" id="ss">—</span>
  <div class="tabs">
    <div class="tab on" onclick="page(0)">Arm</div>
    <div class="tab" onclick="page(1)">EMG</div>
    <div class="tab" onclick="page(2)">Diagnostics</div>
  </div>
  <span style="flex:1"></span>
  <span style="font-size:9px;color:var(--fg2)" id="fp">—</span>
</div>
<div class="body">
  <!-- PAGE 1: ARM -->
  <div class="p1 page on" id="pg0">
    <div class="cv">
      <canvas id="c"></canvas>
      <div class="ov">
        <div class="gn" id="gl">—</div>
        <div class="gc" id="ct">confidence: —</div>
        <div class="cbar"><div class="cfill" id="cb"></div></div>
      </div>
    </div>
    <div class="sb">
      <div class="pn">
        <div class="pt">all gesture classes</div>
        <div id="cl"></div>
      </div>
      <div class="pn">
        <div class="pt">hysteresis gate</div>
        <div id="hy">
          <div class="hyst-label">state: —</div>
          <div class="hyst-row">
            <span>votes:</span>
            <div class="hyst-bar"><div class="hyst-fill" id="hf"></div></div>
            <span id="hv">0/0</span>
          </div>
          <div class="hyst-label" id="ht" style="margin-top:4px">transition: idle</div>
        </div>
      </div>
      <div class="pn">
        <div class="pt">servo positions</div>
        <div id="sl"></div>
      </div>
    </div>
  </div>
  <!-- PAGE 2: EMG -->
  <div class="p2 page" id="pg1"><div id="emg-cards"></div></div>
  <!-- PAGE 3: DIAGNOSTICS -->
  <div class="p3 page" id="pg2">
    <div class="dg-section"><div class="dg-title">system state</div><div id="d-sys"></div></div>
    <div class="dg-section"><div class="dg-title">packet statistics</div><div id="d-pkt"></div></div>
    <div class="dg-section"><div class="dg-title">latency</div><div id="d-lat"></div></div>
    <div class="dg-section"><div class="dg-title">safety</div><div id="d-saf"></div></div>
    <div class="dg-section"><div class="dg-title">dsp pipeline</div><div id="d-dsp"></div></div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function page(n){document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('on',i===n));
document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===n));if(n===0)rz()}

const SV=[{n:'Base',mn:498,mx:2500,ne:1500},{n:'Elbow',mn:1074,mx:1953,ne:1500},
{n:'Forearm',mn:1074,mx:1953,ne:1500},{n:'Wrist1',mn:1001,mx:2002,ne:1500},
{n:'Wrist2',mn:1001,mx:2002,ne:1500},{n:'Gripper',mn:976,mx:1733,ne:1500}];
const GNAMES=['ext','flex','hand','rest'];
const GCOL=['var(--a)','var(--g)','var(--am)','var(--fg2)'];
const K=2.5;
function p2a(s,p){return((p-s.ne)/((s.mx-s.mn)/2))*1.2}

// Three.js — anthropomorphic 6-DOF arm
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(devicePixelRatio);R.setClearColor(0x0c0c10);R.shadowMap.enabled=true;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,1,5000);
cam.position.set(380,280,420);cam.lookAt(0,140,0);
sc.add(new THREE.AmbientLight(0x40404a,.55));
const dlt=new THREE.DirectionalLight(0xffffff,.85);dlt.position.set(250,500,300);dlt.castShadow=true;
dlt.shadow.mapSize.width=1024;dlt.shadow.mapSize.height=1024;
dlt.shadow.camera.left=-300;dlt.shadow.camera.right=300;dlt.shadow.camera.top=300;dlt.shadow.camera.bottom=-300;
sc.add(dlt);
sc.add(new THREE.DirectionalLight(0x4060a0,.25)).position.set(-200,200,-200);
sc.add(new THREE.GridHelper(700,35,0x232328,0x16161c));

// Floor receives shadows
const floor=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.ShadowMaterial({opacity:.35}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);

// Materials — distinguishable link colors so motion is legible.
const M={
  base:    new THREE.MeshPhongMaterial({color:0x2a2a32,shininess:50}),
  link1:   new THREE.MeshPhongMaterial({color:0x3a6fba,shininess:70}),
  link2:   new THREE.MeshPhongMaterial({color:0x2a5da0,shininess:70}),
  joint:   new THREE.MeshPhongMaterial({color:0x4a90d9,shininess:100,emissive:0x0e2540}),
  wrist:   new THREE.MeshPhongMaterial({color:0x6aa8e0,shininess:90}),
  hand:    new THREE.MeshPhongMaterial({color:0x3a3a44,shininess:40}),
  finger:  new THREE.MeshPhongMaterial({color:0xc0c0c8,shininess:80,emissive:0x1a1a20})
};
function cy(rT,rB,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,24),m);o.castShadow=true;o.receiveShadow=true;return o}
function sp(r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),m);o.castShadow=true;return o}
function bx(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;return o}

/* ──────────────────────────────────────────────────────────────────────
 * Joint hierarchy. Each Group's position is the joint pivot; meshes
 * attached to it are the LINK that comes after that joint. Children
 * groups are positioned at the link's far end. This gives correct
 * forward kinematics: rotating Jn at origin pivots Jn's link + all
 * descendants around the joint pivot, which is exactly what a real
 * servo does.
 *
 *   J[0] base yaw   (Y axis)  — Base servo
 *   J[1] shoulder   (Z axis)  — Elbow servo  (lifts upper arm)
 *   J[2] elbow      (Z axis)  — Forearm servo (lifts forearm)
 *   J[3] wrist roll (Y axis)  — Wrist1 servo
 *   J[4] wrist pitch(Z axis)  — Wrist2 servo
 *   J[5] gripper aperture     — Gripper servo (drives finger offset)
 * ────────────────────────────────────────────────────────────────────── */
const J=[];

// Static base column on the floor (no joint — the base SERVO is mounted at top)
const baseColumn=cy(48,52,55,M.base);baseColumn.position.y=27.5;sc.add(baseColumn);
// Mounting plate visual at top
const basePlate=cy(45,45,8,M.base);basePlate.position.y=58;sc.add(basePlate);

// J[0] — base yaw. Pivot at top of column.
const j0=new THREE.Group();j0.position.y=62;sc.add(j0);J.push(j0);
const j0Shell=cy(35,38,24,M.link1);j0Shell.position.y=12;j0.add(j0Shell);          // shoulder housing
const j0Cap  =cy(30,30,4,M.joint); j0Cap.position.y=26;j0.add(j0Cap);             // mounting cap

// J[1] — shoulder pitch. Pivot 18u above base, off-center on +X so the link clears the housing.
const j1=new THREE.Group();j1.position.set(0,28,0);j0.add(j1);J.push(j1);
const j1Knuckle=sp(22,M.joint);j1.add(j1Knuckle);                                   // visible knuckle
// Upper arm link (extends up the +Y of this group). Use 2 cylinders for a "bone" feel.
const upperArm=cy(13,15,140,M.link1);upperArm.position.y=80;j1.add(upperArm);
const upperBand=cy(17,17,8,M.wrist);upperBand.position.y=80;j1.add(upperBand);     // mid band accent

// J[2] — elbow. Pivot at the top of upper arm.
const j2=new THREE.Group();j2.position.y=155;j1.add(j2);J.push(j2);
const j2Knuckle=sp(18,M.joint);j2.add(j2Knuckle);
const forearm=cy(10,12,115,M.link2);forearm.position.y=65;j2.add(forearm);
const forearmBand=cy(14,14,7,M.wrist);forearmBand.position.y=65;j2.add(forearmBand);

// J[3] — wrist roll. Pivot at end of forearm.
const j3=new THREE.Group();j3.position.y=128;j2.add(j3);J.push(j3);
const wristRollHousing=cy(14,14,24,M.link2);wristRollHousing.position.y=12;j3.add(wristRollHousing);
// Roll indicator: small protrusion that visually shows Y-axis rotation
const rollMark=bx(4,18,18,M.wrist);rollMark.position.set(0,12,11);j3.add(rollMark);

// J[4] — wrist pitch. Pivot at top of roll housing.
const j4=new THREE.Group();j4.position.y=26;j3.add(j4);J.push(j4);
const j4Knuckle=sp(13,M.joint);j4.add(j4Knuckle);
// Hand body
const handBody=bx(28,38,22,M.hand);handBody.position.y=24;j4.add(handBody);

// J[5] — gripper. We use a Group only so the index exists; aperture
// is driven by direct finger position update in updateArm().
const j5=new THREE.Group();j5.position.y=45;j4.add(j5);J.push(j5);

/* Real gripper (xArm-style scissor jaw): a flat mounting plate on the
 * wrist with two curved finger arms that pivot from the front of the
 * plate. Open => arms angle OUTWARD in a Y; closed => arms point
 * forward in parallel. We model this as two finger Groups whose
 * rotation.z is driven by the gripper PWM. */

// Mounting plate (rectangular, lies flat above the wrist)
const handPlate=bx(34,6,28,M.hand);handPlate.position.y=4;j5.add(handPlate);
// Central gear hub visible between the fingers
const gripHub=cy(8,8,8,M.wrist);gripHub.position.y=10;j5.add(gripHub);

/* Finger arms. Each is a Group pivoting near the front of the plate.
 * The arm itself extends along +Y of the group (i.e. "forward" in the
 * group's local frame). With group.rotation.z = 0 the arms point
 * forward; positive/negative z-rotation swings them apart. */
function buildFinger(side){            // side = +1 right, -1 left
  const g=new THREE.Group();
  g.position.set(0,8,side*9);          // pivot at the front-edge of the plate
  // Curved arm: two box segments at an angle
  const armProx=bx(8,28,6,M.finger);   // proximal segment (vertical from pivot)
  armProx.position.y=14;g.add(armProx);
  // Tip segment (angled inward like the photo)
  const tip=new THREE.Group();
  tip.position.y=28;
  tip.rotation.z=side*-0.35;           // bend inward
  const tipBox=bx(8,22,7,M.finger);tipBox.position.y=11;tip.add(tipBox);
  // Pad at the tip (rubber-style grip surface)
  const pad=bx(9,5,9,M.wrist);pad.position.y=22;tip.add(pad);
  g.add(tip);
  return g;
}
const fR=buildFinger(+1);j5.add(fR);
const fL=buildFinger(-1);j5.add(fL);

/* ──────────────────────────────────────────────────────────────────────
 * Orbit camera — spherical coordinates around the arm's mid-height.
 * Left-drag rotates yaw/pitch; wheel zooms. The lookAt target is the
 * approximate arm centroid so the user can spin around the joint
 * column without losing it. */
let cT=Math.PI*.85,cP=Math.PI*.32,cD=560,drag=false,lx=0,ly=0;
const camTarget=new THREE.Vector3(0,150,0);
cv.onmousedown=e=>{drag=true;lx=e.clientX;ly=e.clientY};
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(!drag)return;
  cT-=(e.clientX-lx)*.008;
  cP=Math.max(.15,Math.min(Math.PI*.49,cP-(e.clientY-ly)*.006));
  lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{cD=Math.max(220,Math.min(1400,cD+e.deltaY*.55));e.preventDefault()},{passive:false});

// State
let su=[1500,1500,1500,1500,1500,1500],gs='—',co=0,st='—',
rms=Array(8).fill(0),cc=Array(8).fill(0),nc=4,
hConsec=0,hNeeded=0,hType=3,hTypeName='idle',
dPkts=0,dGaps=0,dInf=0,dLat=0,dOvf=0,dSafe=0,dStall=0,
pktLat=0,seqAge=0,dspUs=0,ioReady=false,dspReady=false;

// Build sidebar
const slE=document.getElementById('sl');
SV.forEach((s,i)=>{slE.innerHTML+=`<div class="sr"><span class="sn">${s.n}</span><div class="sw"><div class="sf" id="b${i}"></div></div><span class="sv" id="v${i}">1500</span></div>`});

const clE=document.getElementById('cl');
GNAMES.forEach((g,i)=>{clE.innerHTML+=`<div class="cr"><span class="cn">${g}</span><div class="cw"><div class="cfl" id="cc${i}" style="background:${GCOL[i%GCOL.length]}"></div></div><span class="cv2" id="cv${i}">0%</span></div>`});

// Build EMG page
const ecE=document.getElementById('emg-cards');
const enames=['Forearm','Biceps','Triceps','ch3','ch4','ch5','ch6','ch7'];
for(let i=0;i<8;i++){ecE.innerHTML+=`<div class="emg-card"><div class="emg-idx">${i}</div><div class="emg-info"><div class="emg-name">${enames[i]}</div><div class="emg-bw"><div class="emg-bf" id="em${i}"></div></div><div class="emg-val" id="ev${i}">rms: 0.000</div></div></div>`}

function updateArm(){
  // J[0] base yaw  | J[1] shoulder pitch | J[2] elbow pitch
  // J[3] wrist roll | J[4] wrist pitch
  J[0].rotation.y =  p2a(SV[0],su[0]);
  J[1].rotation.z = -p2a(SV[1],su[1]);
  J[2].rotation.z = -p2a(SV[2],su[2]);
  J[3].rotation.y =  p2a(SV[3],su[3]);
  J[4].rotation.z = -p2a(SV[4],su[4]);
  // Gripper aperture: ap=0 fully open (fingers swung outward),
  // ap=1 fully closed (fingers parallel, pads near touching).
  // Scissor pivot: positive z-rotation swings the +Z finger outward.
  const ap = (su[5]-SV[5].mn)/(SV[5].mx-SV[5].mn);
  const maxSwing = 0.55;                  // radians outward at full open
  const swing = (1-ap) * maxSwing;
  fR.rotation.z = -swing;                 // right finger swings -Z
  fL.rotation.z =  swing;                 // left finger swings +Z
}

function ui(){
document.getElementById('gl').textContent=gs;
document.getElementById('ct').textContent=`confidence: ${(co*100)|0}%`;
const cb=document.getElementById('cb');cb.style.width=(co*100)+'%';
cb.style.background=co>.7?'var(--g)':co>.4?'var(--am)':'var(--r)';

SV.forEach((s,i)=>{
  document.getElementById('b'+i).style.width=Math.max(2,Math.min(100,((su[i]-s.mn)/(s.mx-s.mn))*100))+'%';
  document.getElementById('v'+i).textContent=su[i];
});

for(let i=0;i<Math.min(nc,GNAMES.length);i++){
  const pct=Math.max(0,Math.min(100,(cc[i]||0)*100));
  document.getElementById('cc'+i).style.width=pct+'%';
  document.getElementById('cv'+i).textContent=pct.toFixed(0)+'%';
}

// hysteresis
const hf=document.getElementById('hf');
const pct=hNeeded>0?(hConsec/hNeeded)*100:0;
hf.style.width=pct+'%';
hf.style.background=pct>80?'var(--g)':pct>40?'var(--am)':'var(--a)';
document.getElementById('hv').textContent=`${hConsec}/${hNeeded}`;
document.getElementById('ht').textContent=`transition: ${hTypeName}`;

const se=document.getElementById('ss');se.textContent=st;
se.className='pill '+(st==='RUNNING'?'ok':st==='SAFE'?'err':'wrn');

// EMG
for(let i=0;i<8;i++){
  document.getElementById('em'+i).style.width=Math.min(100,rms[i]*300)+'%';
  document.getElementById('ev'+i).textContent=`rms: ${rms[i].toFixed(4)}`;
}

// Diagnostics
function drow(k,v,cls){return`<div class="dg-row"><span class="l">${k}</span><span class="v ${cls||''}">${v}</span></div>`}
document.getElementById('d-sys').innerHTML=
  drow('state',st,st==='RUNNING'?'good':st==='SAFE'?'bad':'warn')+
  drow('io process',ioReady?'ready':'down',ioReady?'good':'bad')+
  drow('dsp process',dspReady?'ready':'down',dspReady?'good':'bad')+
  drow('active gesture',gs)+
  drow('confidence',(co*100).toFixed(1)+'%',co>.7?'good':co>.4?'warn':'bad');

document.getElementById('d-pkt').innerHTML=
  drow('packets received',dPkts.toLocaleString())+
  drow('sequence gaps',dGaps,dGaps>0?'warn':'')+
  drow('ring overflows',dOvf,dOvf>0?'bad':'')+
  drow('seq age',seqAge+' pkts');

const cpcu_us=pktLat;const bsau_us=594+pktLat+610+15000;
document.getElementById('d-lat').innerHTML=
  '<div style="font-size:9px;color:var(--fg2);margin-bottom:6px">BSAU (constants)</div>'+
  drow('ADC + packet creation','226 µs')+
  drow('wireless TX + ACK','332 µs')+
  '<div style="font-size:9px;color:var(--fg2);margin:6px 0">CPCU (measured)</div>'+
  drow('SPI read + unpack','36 µs')+
  drow('ring dwell','—')+
  drow('DSP compute',(dspUs/1000).toFixed(1)+' ms')+
  drow('inference (max)',(dLat/1000).toFixed(1)+' ms')+
  drow('smoother + I²C','610 µs')+
  '<div style="font-size:9px;color:var(--fg2);margin:6px 0">servo</div>'+
  drow('mechanical response','~15 ms')+
  '<div style="font-size:9px;color:var(--a);margin:8px 0 4px;border-top:1px solid #222;padding-top:6px">totals</div>'+
  drow('CPCU: pkt→servo',(pktLat/1000).toFixed(1)+' ms',pktLat/1000<300?'good':'warn')+
  drow('BSAU→CPCU→servo',(bsau_us/1000).toFixed(1)+' ms')+
  drow('seq age',seqAge+' pkts ('+seqAge+' ms @1kHz)');

document.getElementById('d-saf').innerHTML=
  drow('safe state entries',dSafe,dSafe>0?'warn':'')+
  drow('gripper stalls',dStall,dStall>0?'warn':'')+
  drow('hysteresis type',hTypeName)+
  drow('hysteresis votes',`${hConsec}/${hNeeded}`);

document.getElementById('d-dsp').innerHTML=
  drow('total inferences',dInf.toLocaleString())+
  drow('gesture classes',nc)+
  drow('active class',gs)+
  drow('class confidences',cc.slice(0,nc).map(c=>(c*100).toFixed(0)+'%').join(', '));
}

// WebSocket
let ws=null,wr=0;
function cn(){
const h=location.hostname||'localhost',p=location.port||'8765';
ws=new WebSocket(`ws://${h}:${p}/ws`);
ws.onopen=()=>{document.getElementById('ws').textContent='connected';document.getElementById('ws').className='pill ok';wr=0};
ws.onclose=()=>{document.getElementById('ws').textContent='disconnected';document.getElementById('ws').className='pill err';setTimeout(cn,Math.min(5000,500*++wr))};
ws.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.ch!=='state')return;
st=d.system_state||'—';
ioReady=d.io_ready||false;dspReady=d.dsp_ready||false;
if(d.dsp){gs=d.dsp.gesture||'—';co=d.dsp.confidence||0;
if(d.dsp.channel_rms)rms=d.dsp.channel_rms;
if(d.dsp.class_confidence)cc=d.dsp.class_confidence;
nc=d.dsp.num_classes||4}
if(d.motor&&d.motor.servo_us)su=d.motor.servo_us;
if(d.hysteresis){hConsec=d.hysteresis.consec;hNeeded=d.hysteresis.needed;hType=d.hysteresis.type;hTypeName=d.hysteresis.type_name||'idle'}
if(d.latency){pktLat=d.latency.pkt_to_servo_us||0;seqAge=d.latency.seq_age||0;dspUs=d.latency.dsp_compute_us||0}
if(d.diag){dPkts=d.diag.io_pkts_received||0;dGaps=d.diag.io_seq_gaps||0;
dInf=d.diag.dsp_inferences||0;dLat=d.diag.dsp_max_latency_us||0;
dOvf=d.diag.io_ring_overflows||0;dSafe=d.diag.io_safe_entries||0;dStall=d.diag.io_gripper_stalls||0}
}catch(e){}};
}
cn();

function rz(){const w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
onresize=rz;rz();

let fc=0,ft=performance.now();
function lp(){requestAnimationFrame(lp);
const cy2=160;
cam.position.set(Math.sin(cT)*Math.cos(cP)*cD, Math.sin(cP)*cD+cy2, Math.cos(cT)*Math.cos(cP)*cD);
cam.lookAt(camTarget.set(0,cy2,0));
updateArm();ui();R.render(sc,cam);
fc++;const n=performance.now();if(n-ft>1000){document.getElementById('fp').textContent=fc+' fps';fc=0;ft=n}}
lp();
</script>
